<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Meta Data -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">

    <!-- Title & Favicon -->
    <title>Byens Ismejeri | Flavors of the Day</title>
    <link rel="icon" type="image/png" href="assets/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cookie&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Oswald:wght@200..700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap"
        rel="stylesheet">
</head>

<body>
    <header>
        <div id="header-wrapper">
            <a href="https://byensismejeri.dk" target="_blank"><img src="/assets/favicon.png"></a>
            <h1>Today's flavors</h1>
            <p id="language">EN</p>
        </div>
    </header>
    <section>

        <div id="big-container">
            <div class="image-wrapper">
                <div class="overflow-wrapper">
                    <img id="dayflavor-img" src="" alt="Flavor of the day">
                </div>
            </div>
            
            <div id="column-wrapper">
                <div id="small-container">
                    <p id="month1"></p>
                    <p id="month2"></p>
                </div>
                <p id="dayflavor"></p>
                <p id="subt">Flavor of the day</p>
            </div>
        </div>

        <div id="card-container">
            <div id="card">
                <img id="card-img" src="/assets/img/ic_nutellaorea.png">
                   <div id="card-text"><p>NUTELLA-OREO</p></div>
            </div>
            <div id="card">
                <img id="card-img" src="/assets/img/ic_angelhair.png">
                   <div id="card-text"><p>ANGEL HAIR</p></div>
            </div>
        </div>
    </section>

    <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-card">
        <div class="modal-slant-wrapper">
            <div class="modal-slant"></div>
        </div>

        <button id="close-btn">
            <svg viewBox="0 0 24 24">
                <path d="M4 14 L12 14 L12 22 M14 4 L14 12 L22 12" />
            </svg>
        </button>

        <img id="modal-img" src="" alt="Ice cream image">
        
        <div class="modal-content">
            <h2 id="modal-title"></h2>
            
            <div class="info-grid">
                <div class="info-box">
                    <h3>Allergens</h3>
                    <ul id="modal-allergens">

                    </ul>
                </div>
                
                <div class="info-box">
                    <h3>Traces</h3>
                    <ul id="modal-traces">

                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>

    <script src="cards.js"></script>
</body>
</html>
